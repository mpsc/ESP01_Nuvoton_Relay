[env:esp01_1m]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino

monitor_speed = 115200
upload_speed = 115200

board_build.flash_size = 1M
board_build.ldscript = eagle.flash.1m256.ld

lib_deps =
    knolleary/PubSubClient@^2.8

build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
    -D MQTT_KEEPALIVE=30
    -Wall
    -Os

build_src_filter = +<*> -<probe.cpp>